<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>SECTOR 486</title>
<style>
  :root { --ink:#c8b89a; --dim:#6a7a72; --bg:#0b0d0c; --red:#a03028; --amb:#c8a040; }
  * { box-sizing:border-box; user-select:none; -webkit-user-select:none; }
  html,body { margin:0; height:100%; background:#050605; color:var(--ink);
    font-family:"Lucida Console","Courier New",monospace; overflow:hidden; touch-action:none; }
  #wrap { position:relative; width:100%; height:100%; max-width:1100px; margin:0 auto;
    background:#000; }
  #view { position:absolute; inset:0; width:100%; height:100%;
    image-rendering:pixelated; image-rendering:crisp-edges;
    background:#102018; display:block; cursor:crosshair; }
  #scan { pointer-events:none; position:absolute; inset:0;
    background:repeating-linear-gradient(to bottom, rgba(0,0,0,.18) 0 1px, transparent 1px 3px);
    mix-blend-mode:multiply; }
  #hud { position:absolute; top:0; left:0; right:0; height:28px; display:none;
    align-items:center; justify-content:space-between; padding:0 10px;
    background:linear-gradient(#1a221c,#0e1410); color:#b8d0a8; font-size:12px;
    border-bottom:2px solid #3a4a3a; letter-spacing:1px; }
  #hud b { color:#e8d080; }
  #touch { display:none; position:absolute; inset:0; pointer-events:none; }
  .stick-base { position:absolute; left:18px; bottom:18px; width:110px; height:110px;
    border:2px solid rgba(180,200,160,.35); border-radius:50%; pointer-events:auto;
    background:rgba(0,0,0,.25); }
  .stick-knob { position:absolute; width:44px; height:44px; margin:-22px 0 0 -22px;
    left:55px; top:55px; border-radius:50%; background:rgba(180,200,160,.4); }
  .btn { pointer-events:auto; position:absolute; border:2px solid rgba(180,200,160,.45);
    background:rgba(20,30,24,.55); color:#d0e0c8; font:14px monospace; }
  #btn-fire { right:18px; bottom:22px; width:84px; height:84px; border-radius:50%; }
  #btn-use { right:112px; bottom:28px; width:56px; height:56px; border-radius:8px; }
  #btn-map { right:18px; top:36px; padding:6px 10px; }
  #overlay { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    background:rgba(0,0,0,.72); }
  #panel { width:min(420px,92%); padding:22px 20px; background:#10160f;
    border:3px solid #6a7a50; box-shadow:inset 0 0 0 2px #2a3820, 0 0 0 1px #000;
    text-align:center; }
  #panel h1 { margin:0 0 4px; font-size:34px; color:#d8c070; letter-spacing:4px; }
  #panel .sub { color:#7a9a7a; margin-bottom:18px; font-size:12px; letter-spacing:3px; }
  #panel p { color:#9aaa90; font-size:13px; line-height:1.55; text-align:left; }
  #panel button { margin:6px 4px 0; padding:8px 16px; font:14px monospace; cursor:pointer;
    background:#2a3a28; color:#e8e0c0; border:2px solid #8a9a60; }
  #panel button:hover { background:#3a4e34; }
  #boot { white-space:pre; text-align:left; color:#3d8a4a; font-size:13px; line-height:1.5; }
  #flash { pointer-events:none; position:absolute; inset:0; background:#801010; opacity:0; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="view" width="320" height="200"></canvas>
  <div id="scan"></div>
  <div id="flash"></div>
  <div id="hud">
    <span>HP <b id="hp">100</b></span>
    <span>AMMO <b id="ammo">28</b></span>
    <span>FLOOR <b id="floor">1</b></span>
    <span>HOSTILES <b id="host">0</b></span>
  </div>
  <div id="touch">
    <div class="stick-base" id="stick"><div class="stick-knob" id="knob"></div></div>
    <button class="btn" id="btn-fire">FIRE</button>
    <button class="btn" id="btn-use">USE</button>
    <button class="btn" id="btn-map">MAP</button>
  </div>
  <div id="overlay"><div id="panel"></div></div>
</div>
<script>
/* ============================================================
   맵 수정법
   MAPS[].src 문자열: 한 줄 = 한 행. 모든 줄 길이가 같아야 한다.
     . 빈칸   # 벽돌   = 철벽   C 컴퓨터 패널   Z 경고 줄무늬
     D 문     S 비밀벽(USE로 개방)
     * 시작   X 출구 엘리베이터
     + 체력   A 탄약
     g 졸개   r 사수
   ============================================================ */
(function () {
  "use strict";

  var W = 320, H = 200;
  var canvas = document.getElementById("view");
  var ctx = canvas.getContext("2d", { alpha: false });
  ctx.imageSmoothingEnabled = false;

  var overlay = document.getElementById("overlay");
  var panel = document.getElementById("panel");
  var hud = document.getElementById("hud");
  var touchUI = document.getElementById("touch");
  var flashEl = document.getElementById("flash");
  var isTouch = matchMedia("(pointer:coarse)").matches || "ontouchstart" in window;

  var AC = null;
  function audioCtx() {
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === "suspended") AC.resume();
    return AC;
  }
  function beep(type, freq, dur, vol) {
    try {
      var ac = audioCtx();
      var t = ac.currentTime;
      var o = ac.createOscillator();
      var g = ac.createGain();
      o.type = type;
      o.frequency.setValueAtTime(freq, t);
      g.gain.setValueAtTime(vol || 0.08, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      o.connect(g); g.connect(ac.destination);
      o.start(t); o.stop(t + dur);
    } catch (e) {}
  }
  function noise(dur, vol) {
    try {
      var ac = audioCtx();
      var n = ac.createBuffer(1, ac.sampleRate * dur, ac.sampleRate);
      var d = n.getChannelData(0);
      for (var i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
      var s = ac.createBufferSource(); s.buffer = n;
      var g = ac.createGain(); g.gain.value = vol || 0.12;
      var f = ac.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 1800;
      s.connect(f); f.connect(g); g.connect(ac.destination); s.start();
    } catch (e) {}
  }

  function tex64(fn) {
    var s = 64, data = new Uint8ClampedArray(s * s * 4);
    for (var y = 0; y < s; y++) for (var x = 0; x < s; x++) {
      var c = fn(x, y);
      var i = (y * s + x) * 4;
      data[i] = c[0]; data[i + 1] = c[1]; data[i + 2] = c[2]; data[i + 3] = 255;
    }
    return data;
  }
  function pix(data, x, y) {
    x &= 63; y &= 63;
    var i = (y * 64 + x) * 4;
    return [data[i], data[i + 1], data[i + 2]];
  }

  var TEX = {
    1: tex64(function (x, y) {
      var brick = ((x >> 3) + (y >> 3) * 3) & 1;
      var mortar = (y & 7) === 0 || ((x + ((y >> 3) & 1) * 4) & 7) === 0;
      if (mortar) return [52, 42, 36];
      return brick ? [118, 62, 48] : [96, 50, 40];
    }),
    2: tex64(function (x, y) {
      var v = 70 + ((x * 13 + y * 7) & 15);
      if ((x & 15) < 2 || (y & 15) < 2) v -= 18;
      if ((x & 15) === 4 && (y & 15) === 4) return [160, 160, 150];
      return [v, v + 4, v + 8];
    }),
    3: tex64(function (x, y) {
      if (x < 3 || y < 3 || x > 60 || y > 60) return [28, 32, 30];
      if ((x & 7) < 5 && (y & 7) < 5) {
        var on = ((x >> 3) + (y >> 3) + ((x * y) & 3)) & 1;
        return on ? [40, 180, 90] : [20, 50, 40];
      }
      return [18, 22, 24];
    }),
    4: tex64(function (x, y) {
      var band = ((x + y) / 8 | 0) & 1;
      return band ? [180, 150, 30] : [18, 16, 12];
    }),
    5: tex64(function (x, y) {
      if (x > 26 && x < 38) return [40, 32, 24];
      var v = 90 + (y & 3);
      if ((y & 7) === 0) v -= 20;
      if (x > 44 && x < 50 && y > 30 && y < 38) return [160, 140, 50];
      return [v, v - 20, v - 35];
    }),
    6: null
  };
  TEX[6] = TEX[1];

  function spr(w, h, fn) {
    var data = new Uint8ClampedArray(w * h * 4);
    for (var y = 0; y < h; y++) for (var x = 0; x < w; x++) {
      var c = fn(x, y, w, h);
      var i = (y * w + x) * 4;
      if (!c) { data[i + 3] = 0; continue; }
      data[i] = c[0]; data[i + 1] = c[1]; data[i + 2] = c[2]; data[i + 3] = 255;
    }
    return { w: w, h: h, data: data };
  }
  var SPR = {
    grunt: spr(32, 48, function (x, y) {
      var dx = x - 16;
      if (y >= 6 && y <= 46 && Math.abs(dx) <= 10) {
        if (y < 18 && Math.abs(dx) <= 7) {
          if (y > 11 && y < 15 && Math.abs(dx) > 2) return [20, 16, 12];
          return [196, 158, 118];
        }
        if (y >= 18 && y < 36 && Math.abs(dx) <= 9) return [88, 118, 64];
        if (y >= 36) return [48, 46, 58];
      }
      if (y >= 20 && y < 34 && dx >= 8 && dx <= 14) return [110, 90, 55];
      return null;
    }),
    shooter: spr(32, 48, function (x, y) {
      var dx = x - 16;
      if (y >= 6 && y <= 46 && Math.abs(dx) <= 10) {
        if (y < 18 && Math.abs(dx) <= 7) return [210, 86, 70];
        if (y >= 18 && y < 34 && Math.abs(dx) <= 9) return [62, 70, 96];
        if (y >= 34) return [36, 36, 42];
      }
      if (y > 16 && y < 30 && dx >= 8 && dx <= 15) return [120, 120, 90];
      return null;
    }),
    dead: spr(32, 24, function (x, y) {
      var dx = x - 16, dy = y - 14;
      if (dx * dx + dy * dy * 3 < 90) return [80, 30, 28];
      return null;
    }),
    hp: spr(24, 24, function (x, y) {
      if (x > 4 && x < 20 && y > 6 && y < 20) {
        if ((x > 10 && x < 14) || (y > 10 && y < 14)) return [200, 40, 40];
        return [220, 220, 210];
      }
      return null;
    }),
    ammo: spr(24, 20, function (x, y) {
      if (x > 3 && x < 21 && y > 4 && y < 18) return [80, 90, 50];
      if (x > 7 && x < 17 && y > 1 && y < 6) return [160, 150, 70];
      return null;
    }),
    ball: spr(10, 10, function (x, y) {
      var dx = x - 5, dy = y - 5;
      if (dx * dx + dy * dy < 16) return [220, 180, 60];
      return null;
    })
  };

  var MAPS = [
    { src: [
      "################",
      "#*..g.#......X.#",
      "#.....#........#",
      "####D#####D#####",
      "#.....#......A.#",
      "#..g..D....g...#",
      "#.....#........#",
      "#..#######D#####",
      "#+.#.....#.....#",
      "#..#..g..#..S..#",
      "#..#.....#.....#",
      "#..####D########",
      "#..............#",
      "#.....r........#",
      "#..............#",
      "################"
    ].join("\n") },
    { src: [
      "################",
      "#*..C....C.....#",
      "#...C....C..g..#",
      "#======D=======#",
      "#....#....#....#",
      "#..r.D....D..r.#",
      "#....#....#....#",
      "#ZZ##======##ZZ#",
      "#..............#",
      "#..g........g..#",
      "#..............#",
      "###D##C##C##D###",
      "#....#....#...X#",
      "#..A.#.S..#.A..#",
      "#+...#....#....#",
      "################"
    ].join("\n") }
  ];

  var LEGEND = {
    ".": 0, "#": 1, "=": 2, "C": 3, "Z": 4, "D": 5, "S": 6,
    "*": 0, "X": 0, "+": 0, "A": 0, "g": 0, "r": 0
  };

  function loadLevel(src) {
    var rows = src.trim().split("\n").map(function (r) { return r.trim(); });
    var h = rows.length, w = rows[0].length;
    var tiles = new Uint8Array(w * h);
    var level = { w: w, h: h, tiles: tiles, spawn: { x: 1.5, y: 1.5, dir: 0 },
      exit: { x: 2.5, y: 2.5 }, items: [], enemies: [] };
    for (var y = 0; y < h; y++) {
      if (rows[y].length !== w) throw new Error("map row " + y);
      for (var x = 0; x < w; x++) {
        var ch = rows[y][x];
        tiles[y * w + x] = LEGEND[ch] !== undefined ? LEGEND[ch] : 1;
        var fx = x + 0.5, fy = y + 0.5;
        if (ch === "*") level.spawn = { x: fx, y: fy, dir: 0 };
        if (ch === "X") level.exit = { x: fx, y: fy };
        if (ch === "+") level.items.push({ x: fx, y: fy, type: "hp", taken: false });
        if (ch === "A") level.items.push({ x: fx, y: fy, type: "ammo", taken: false });
        if (ch === "g") level.enemies.push(makeEnemy(fx, fy, "grunt"));
        if (ch === "r") level.enemies.push(makeEnemy(fx, fy, "shooter"));
      }
    }
    return level;
  }

  function makeEnemy(x, y, kind) {
    return {
      x: x, y: y, kind: kind,
      hp: kind === "shooter" ? 3 : 2,
      speed: kind === "shooter" ? 1.55 : 1.15,
      dead: false, hurt: 0, shootT: 0.8 + Math.random(), frame: 0
    };
  }

  var mode = "boot";
  var floorIdx = 0;
  var level = null;
  var openDoors = {};
  var px = 1.5, py = 1.5, dir = 0;
  var hp = 100, ammo = 28, invuln = 0, cool = 0, recoil = 0, bob = 0;
  var showMap = false, paused = false;
  var zbuf = new Float32Array(W);
  var keys = {};
  var mvx = 0, mvy = 0, touchLookLast = null;
  var fireHeld = false, useHeld = false, useLatch = false;
  var bullets = [];
  var screenBuf = ctx.createImageData(W, H);
  var shake = 0, hurtFlash = 0;

  function tileAt(x, y) {
    var ix = x | 0, iy = y | 0;
    if (ix < 0 || iy < 0 || ix >= level.w || iy >= level.h) return 1;
    var t = level.tiles[iy * level.w + ix];
    if ((t === 5 || t === 6) && openDoors[ix + "," + iy]) return 0;
    return t;
  }
  function blocked(x, y) { return tileAt(x, y) > 0; }
  function solid(x, y, rad) {
    return blocked(x - rad, y - rad) || blocked(x + rad, y - rad) ||
      blocked(x - rad, y + rad) || blocked(x + rad, y + rad);
  }

  function resetRun() {
    floorIdx = 0;
    hp = 100; ammo = 28;
    startFloor(0);
  }
  function startFloor(i) {
    floorIdx = i;
    level = loadLevel(MAPS[i].src);
    openDoors = {};
    px = level.spawn.x; py = level.spawn.y; dir = level.spawn.dir;
    bullets = [];
    invuln = 0.4; cool = 0; recoil = 0;
    if (!isFinite(px + py + dir)) { px = 1.5; py = 1.5; dir = 0; }
  }

  function tryUse() {
    var lx = px + Math.cos(dir) * 0.85;
    var ly = py + Math.sin(dir) * 0.85;
    var ix = lx | 0, iy = ly | 0;
    var t = tileAt(ix, iy);
    var key = ix + "," + iy;
    if (level.tiles[iy * level.w + ix] === 5) {
      openDoors[key] = !openDoors[key];
      beep("square", 180, 0.12, 0.06);
      return;
    }
    if (level.tiles[iy * level.w + ix] === 6 && !openDoors[key]) {
      openDoors[key] = true;
      beep("square", 320, 0.2, 0.07);
      level.items.push({ x: ix + 0.5, y: iy + 0.5, type: "hp", taken: false });
      level.items.push({ x: ix + 0.7, y: iy + 0.3, type: "ammo", taken: false });
    }
  }

  function openDoorAt(x, y) {
    var ix = x | 0, iy = y | 0;
    if (ix < 0 || iy < 0 || ix >= level.w || iy >= level.h) return;
    if (level.tiles[iy * level.w + ix] === 5 && !openDoors[ix + "," + iy]) {
      openDoors[ix + "," + iy] = true;
      beep("square", 180, 0.1, 0.05);
    }
  }

  function tryStep(dx, dy, rad) {
    var nx = px + dx, ny = py + dy;
    if (!solid(nx, py, rad)) px = nx;
    else openDoorAt(nx, py);
    if (!solid(px, ny, rad)) py = ny;
    else openDoorAt(px, ny);
    px = Math.max(0.35, Math.min(level.w - 0.35, px));
    py = Math.max(0.35, Math.min(level.h - 0.35, py));
  }

  function los(ax, ay, bx, by) {
    var dx = bx - ax, dy = by - ay, dist = Math.hypot(dx, dy);
    if (dist < 0.2) return true;
    var steps = dist * 8 | 0;
    for (var i = 1; i < steps; i++) {
      var t = i / steps;
      if (blocked(ax + dx * t, ay + dy * t)) return false;
    }
    return true;
  }

  function hitPlayer(dmg) {
    if (invuln > 0) return;
    hp -= dmg;
    invuln = 0.55;
    hurtFlash = 1;
    shake = 4;
    beep("sawtooth", 90, 0.18, 0.1);
    if (hp <= 0) {
      hp = 0;
      setMode("dead");
    }
  }

  function shoot() {
    if (cool > 0) return;
    if (ammo <= 0) { beep("square", 70, 0.06, 0.04); cool = 0.2; return; }
    ammo--;
    cool = 0.28;
    recoil = 10;
    noise(0.08, 0.16);
    var best = null, bestD = 18;
    var aim = 0.11;
    for (var i = 0; i < level.enemies.length; i++) {
      var e = level.enemies[i];
      if (e.dead || e.hp <= 0) continue;
      var dx = e.x - px, dy = e.y - py;
      var dist = Math.hypot(dx, dy);
      var ang = Math.atan2(dy, dx);
      var da = ang - dir;
      while (da > Math.PI) da -= Math.PI * 2;
      while (da < -Math.PI) da += Math.PI * 2;
      if (Math.abs(da) < aim && dist < bestD && los(px, py, e.x, e.y)) {
        best = e; bestD = dist;
      }
    }
    if (best) {
      best.hp--;
      best.hurt = 0.2;
      beep("square", 240, 0.05, 0.05);
      if (best.hp <= 0) { best.dead = true; beep("triangle", 110, 0.25, 0.08); }
    }
  }

  function update(dt) {
    if (!isFinite(dir)) dir = 0;
    while (dir > Math.PI) dir -= Math.PI * 2;
    while (dir < -Math.PI) dir += Math.PI * 2;
    var run = keys.ShiftLeft || keys.ShiftRight ? 1.7 : 1;
    var f = (keys.KeyW || keys.ArrowUp ? 1 : 0) + (keys.KeyS || keys.ArrowDown ? -1 : 0) + mvy;
    var s = (keys.KeyD || keys.ArrowRight ? 1 : 0) + (keys.KeyA || keys.ArrowLeft ? -1 : 0) + mvx;
    var sp = 2.35 * run * dt;
    if (f || s) {
      var fl = Math.hypot(f, s) || 1;
      f /= fl; s /= fl;
      tryStep(
        Math.cos(dir) * f * sp + Math.cos(dir + Math.PI / 2) * s * sp,
        Math.sin(dir) * f * sp + Math.sin(dir + Math.PI / 2) * s * sp,
        0.22
      );
      bob += dt * 10 * run;
    }

    if (keys.KeyE || keys.KeyF || useHeld) {
      if (!useLatch) { tryUse(); useLatch = true; }
    } else useLatch = false;

    if (fireHeld || keys.Space) shoot();

    cool = Math.max(0, cool - dt);
    invuln = Math.max(0, invuln - dt);
    recoil = Math.max(0, recoil - dt * 28);
    shake = Math.max(0, shake - dt * 12);
    hurtFlash = Math.max(0, hurtFlash - dt * 2.5);
    flashEl.style.opacity = hurtFlash * 0.45;

    var i, e;
    for (i = 0; i < level.items.length; i++) {
      var it = level.items[i];
      if (it.taken) continue;
      if (Math.hypot(it.x - px, it.y - py) < 0.55) {
        it.taken = true;
        if (it.type === "hp") { hp = Math.min(100, hp + 40); beep("square", 520, 0.12, 0.06); }
        else { ammo = Math.min(99, ammo + 18); beep("square", 400, 0.1, 0.06); }
      }
    }

    for (i = 0; i < level.enemies.length; i++) {
      e = level.enemies[i];
      e.hurt = Math.max(0, e.hurt - dt);
      if (e.dead) continue;
      var sees = los(e.x, e.y, px, py);
      var dx = px - e.x, dy = py - e.y;
      var dist = Math.hypot(dx, dy) || 0.001;
      if (sees) {
        if (e.kind === "grunt" || dist > 4.2) {
          var spd = e.speed * dt;
          var mx = dx / dist * spd, my = dy / dist * spd;
          var nx = e.x, ny = e.y;
          if (!solid(e.x + mx, e.y, 0.24)) e.x += mx;
          if (!solid(e.x, e.y + my, 0.24)) e.y += my;
          e.x = Math.max(0.4, Math.min(level.w - 0.4, e.x));
          e.y = Math.max(0.4, Math.min(level.h - 0.4, e.y));
        }
        if (e.kind === "grunt" && dist < 0.72) hitPlayer(10);
        if (e.kind === "shooter") {
          e.shootT -= dt;
          if (e.shootT <= 0 && dist < 9) {
            e.shootT = 1.6;
            var ang = Math.atan2(dy, dx);
            bullets.push({ x: e.x, y: e.y, dx: Math.cos(ang) * 4.2, dy: Math.sin(ang) * 4.2, life: 2.2 });
            beep("square", 160, 0.06, 0.05);
          }
        }
      }
    }

    for (i = bullets.length - 1; i >= 0; i--) {
      var b = bullets[i];
      b.x += b.dx * dt; b.y += b.dy * dt; b.life -= dt;
      if (b.life <= 0 || blocked(b.x, b.y)) { bullets.splice(i, 1); continue; }
      if (Math.hypot(b.x - px, b.y - py) < 0.32) { hitPlayer(11); bullets.splice(i, 1); }
    }

    if (Math.hypot(px - level.exit.x, py - level.exit.y) < 0.65) {
      if (floorIdx === 0) setMode("floorclear");
      else setMode("win");
    }

    document.getElementById("hp").textContent = hp | 0;
    document.getElementById("ammo").textContent = ammo | 0;
    document.getElementById("floor").textContent = (floorIdx + 1);
    var live = 0;
    for (i = 0; i < level.enemies.length; i++) if (!level.enemies[i].dead) live++;
    document.getElementById("host").textContent = live;
  }

  function cast() {
    var data = screenBuf.data;
    var y, x, i, e, r, g, b;
    for (y = 0; y < H; y++) {
      var ceil = y < H / 2;
      var t = ceil ? y / (H / 2) : (y - H / 2) / (H / 2);
      if (ceil) { r = 22 + t * 28; g = 36 + t * 36; b = 40 + t * 32; }
      else { r = 72 - t * 22; g = 56 - t * 18; b = 36 - t * 12; }
      for (x = 0; x < W; x++) {
        i = (y * W + x) * 4;
        data[i] = r; data[i + 1] = g; data[i + 2] = b; data[i + 3] = 255;
      }
    }

    var dirX = Math.cos(dir), dirY = Math.sin(dir);
    var planeX = -dirY * 0.66, planeY = dirX * 0.66;

    for (x = 0; x < W; x++) {
      var cam = 2 * x / W - 1;
      var rdx = dirX + planeX * cam;
      var rdy = dirY + planeY * cam;
      var mapX = px | 0, mapY = py | 0;
      var ddx = rdx === 0 ? 1e30 : Math.abs(1 / rdx);
      var ddy = rdy === 0 ? 1e30 : Math.abs(1 / rdy);
      var stepX, stepY, sdx, sdy, side = 0;
      if (rdx < 0) { stepX = -1; sdx = (px - mapX) * ddx; }
      else { stepX = 1; sdx = (mapX + 1 - px) * ddx; }
      if (rdy < 0) { stepY = -1; sdy = (py - mapY) * ddy; }
      else { stepY = 1; sdy = (mapY + 1 - py) * ddy; }
      var hit = 0, ttype = 0, guard = 0;
      while (hit === 0 && guard++ < 64) {
        if (sdx < sdy) { sdx += ddx; mapX += stepX; side = 0; }
        else { sdy += ddy; mapY += stepY; side = 1; }
        ttype = tileAt(mapX, mapY);
        if (ttype > 0) hit = 1;
      }
      var dist;
      if (side === 0) dist = (mapX - px + (1 - stepX) / 2) / rdx;
      else dist = (mapY - py + (1 - stepY) / 2) / rdy;
      if (!isFinite(dist) || dist < 0.05) dist = 0.05;
      zbuf[x] = dist;
      var lineH = (H / dist) | 0;
      var ds = ((H - lineH) / 2) | 0;
      var de = ((H + lineH) / 2) | 0;
      if (ds < 0) ds = 0;
      if (de >= H) de = H - 1;
      var wallX = side === 0 ? py + dist * rdy : px + dist * rdx;
      wallX -= Math.floor(wallX);
      var texX = (wallX * 64) | 0;
      if (side === 0 && rdx > 0) texX = 63 - texX;
      if (side === 1 && rdy < 0) texX = 63 - texX;
      var td = TEX[ttype] || TEX[1];
      var shade = Math.max(0.18, 1 - dist / 12) * (side ? 0.72 : 1);
      for (y = ds; y <= de; y++) {
        var d = y * 256 - H * 128 + lineH * 128;
        var texY = ((d * 64) / lineH / 256) | 0;
        if (texY < 0) texY = 0;
        if (texY > 63) texY = 63;
        var p = pix(td, texX, texY);
        i = (y * W + x) * 4;
        data[i] = p[0] * shade;
        data[i + 1] = p[1] * shade;
        data[i + 2] = p[2] * shade;
      }
    }

    var sprites = [];
    for (i = 0; i < level.enemies.length; i++) {
      e = level.enemies[i];
      sprites.push({ x: e.x, y: e.y, spr: e.dead ? SPR.dead : (e.kind === "shooter" ? SPR.shooter : SPR.grunt),
        hurt: e.hurt, scale: e.dead ? 0.55 : 1 });
    }
    for (i = 0; i < level.items.length; i++) {
      var it = level.items[i];
      if (it.taken) continue;
      sprites.push({ x: it.x, y: it.y, spr: it.type === "hp" ? SPR.hp : SPR.ammo, hurt: 0, scale: 0.55 });
    }
    for (i = 0; i < bullets.length; i++) {
      sprites.push({ x: bullets[i].x, y: bullets[i].y, spr: SPR.ball, hurt: 0, scale: 0.3 });
    }
    sprites.sort(function (a, b) {
      return (px - b.x) * (px - b.x) + (py - b.y) * (py - b.y) - ((px - a.x) * (px - a.x) + (py - a.y) * (py - a.y));
    });

    for (var s = 0; s < sprites.length; s++) {
      var sp = sprites[s];
      var sx = sp.x - px, sy = sp.y - py;
      var inv = 1.0 / (planeX * dirY - dirX * planeY);
      var tx = inv * (dirY * sx - dirX * sy);
      var ty = inv * (-planeY * sx + planeX * sy);
      if (ty <= 0.08) continue;
      var screenX = (W / 2) * (1 + tx / ty);
      var sprH = Math.abs(H / ty) * sp.scale;
      var sprW = sprH * (sp.spr.w / sp.spr.h);
      var dsx = (-sprW / 2 + screenX) | 0;
      var dex = (sprW / 2 + screenX) | 0;
      var dsy = (-sprH / 2 + H / 2) | 0;
      var dey = (sprH / 2 + H / 2) | 0;
      for (x = dsx; x < dex; x++) {
        if (x < 0 || x >= W) continue;
        if (ty >= zbuf[x]) continue;
        var texX = ((x - dsx) * sp.spr.w / sprW) | 0;
        for (y = dsy; y < dey; y++) {
          if (y < 0 || y >= H) continue;
          var texY = ((y - dsy) * sp.spr.h / sprH) | 0;
          if (texX < 0 || texY < 0 || texX >= sp.spr.w || texY >= sp.spr.h) continue;
          var si = (texY * sp.spr.w + texX) * 4;
          if (sp.spr.data[si + 3] < 128) continue;
          i = (y * W + x) * 4;
          var sh = Math.max(0.25, 1 - ty / 12);
          r = sp.spr.data[si] * sh;
          g = sp.spr.data[si + 1] * sh;
          b = sp.spr.data[si + 2] * sh;
          if (sp.hurt > 0) { r = 220; g *= 0.3; b *= 0.3; }
          data[i] = r; data[i + 1] = g; data[i + 2] = b;
        }
      }
    }
    ctx.putImageData(screenBuf, 0, 0);
  }

  function drawWeapon() {
    var t = Date.now() / 180;
    var bx = 210 + Math.sin(bob) * 6;
    var by = 148 + Math.abs(Math.cos(bob)) * 3 + recoil;
    ctx.fillStyle = "#2a2a28";
    ctx.fillRect(bx, by + 18, 70, 40);
    ctx.fillStyle = "#3a3a36";
    ctx.fillRect(bx + 8, by, 48, 28);
    ctx.fillStyle = "#111";
    ctx.fillRect(bx + 18, by + 8, 36, 8);
    ctx.fillStyle = "#c8b060";
    ctx.fillRect(bx + 52, by + 10, 18, 5);
    if (recoil > 4) {
      ctx.fillStyle = "#ffe8a0";
      ctx.fillRect(bx + 68, by + 4, 16, 10);
    }
  }

  function drawMinimap() {
    if (!showMap || !level) return;
    var sc = 4, ox = 8, oy = 32;
    ctx.fillStyle = "rgba(0,0,0,0.55)";
    ctx.fillRect(ox - 2, oy - 2, level.w * sc + 4, level.h * sc + 4);
    for (var y = 0; y < level.h; y++) for (var x = 0; x < level.w; x++) {
      var t = tileAt(x, y);
      ctx.fillStyle = t ? "#5a4030" : "#1a3020";
      if (t === 5) ctx.fillStyle = "#8a7030";
      ctx.fillRect(ox + x * sc, oy + y * sc, sc, sc);
    }
    ctx.fillStyle = "#e8e050";
    ctx.fillRect(ox + (px * sc) - 1, oy + (py * sc) - 1, 3, 3);
    ctx.strokeStyle = "#e8e050";
    ctx.beginPath();
    ctx.moveTo(ox + px * sc, oy + py * sc);
    ctx.lineTo(ox + (px + Math.cos(dir) * 2) * sc, oy + (py + Math.sin(dir) * 2) * sc);
    ctx.stroke();
  }

  function render() {
    if (mode !== "game" && mode !== "pause") return;
    var ox = 0, oy = 0;
    if (shake > 0) { ox = (Math.random() - 0.5) * shake; oy = (Math.random() - 0.5) * shake; }
    ctx.setTransform(1, 0, 0, 1, ox, oy);
    cast();
    drawWeapon();
    drawMinimap();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
  }

  function setMode(m) {
    mode = m;
    paused = m === "pause";
    hud.style.display = (m === "game" || m === "pause") ? "flex" : "none";
    touchUI.style.display = (isTouch && m === "game") ? "block" : "none";
    if (m === "boot") {
      overlay.style.display = "flex";
      panel.innerHTML = '<div id="boot"></div>';
      runBoot();
      return;
    }
    if (m === "title") {
      overlay.style.display = "flex";
      panel.innerHTML =
        "<h1>SECTOR 486</h1><div class='sub'>MINI RAYCASTER</div>" +
        "<button id='b-start'>게임 시작</button>" +
        "<button id='b-help'>조작법</button>" +
        "<button id='b-full'>전체화면</button>";
      document.getElementById("b-start").onclick = startGame;
      document.getElementById("b-help").onclick = function () { setMode("help"); };
      document.getElementById("b-full").onclick = goFull;
      return;
    }
    if (m === "help") {
      overlay.style.display = "flex";
      panel.innerHTML =
        "<h1>OPS</h1><p>WASD 이동 · 마우스 시야(화면 클릭)<br>클릭/스페이스 발사 · E 문/비밀벽<br>Shift 달리기 · Esc 일시정지 · Tab 맵<br><br>모바일: 왼쪽 스틱, 오른쪽 스와이프 시야, FIRE/USE</p>" +
        "<button id='b-back'>타이틀</button>";
      document.getElementById("b-back").onclick = function () { setMode("title"); };
      return;
    }
    if (m === "game") {
      overlay.style.display = "none";
      return;
    }
    overlay.style.display = "flex";
    var title = "", msg = "";
    if (m === "pause") { title = "PAUSED"; msg = "SECTOR HOLD"; }
    if (m === "dead") { title = "YOU ARE DEAD"; msg = "SIGNAL LOST"; document.exitPointerLock && document.exitPointerLock(); }
    if (m === "floorclear") { title = "FLOOR CLEAR"; msg = "ELEVATOR UP"; }
    if (m === "win") { title = "SECTOR SECURE"; msg = "486 UNIT STANDING BY"; document.exitPointerLock && document.exitPointerLock(); }
    var extra = "";
    if (m === "floorclear") extra = "<button id='b-next'>2층으로</button>";
    else extra = "<button id='b-retry'>다시하기</button>";
    panel.innerHTML = "<h1>" + title + "</h1><div class='sub'>" + msg + "</div>" + extra +
      "<button id='b-title'>타이틀</button>";
    if (m === "pause") {
      panel.innerHTML = "<h1>PAUSED</h1><div class='sub'>SECTOR HOLD</div>" +
        "<button id='b-res'>계속</button><button id='b-retry'>다시하기</button><button id='b-title'>타이틀</button>";
      document.getElementById("b-res").onclick = function () { setMode("game"); };
    }
    var nr = document.getElementById("b-retry");
    if (nr) nr.onclick = function () { resetRun(); setMode("game"); };
    var nt = document.getElementById("b-title");
    if (nt) nt.onclick = function () { setMode("title"); };
    var nx = document.getElementById("b-next");
    if (nx) nx.onclick = function () { startFloor(1); setMode("game"); };
  }

  function runBoot() {
    var lines = [
      "Award Modular BIOS v4.50G",
      "CPU 486DX2 66MHz",
      "640KB OK",
      "VGA 320x200 detected",
      "MAP.DAT ........... OK",
      "LOADING SECTOR 486"
    ];
    var el = document.getElementById("boot");
    var n = 0;
    function step() {
      if (!el) return;
      el.textContent = lines.slice(0, n).join("\n");
      n++;
      if (n <= lines.length) setTimeout(step, 220);
      else setTimeout(function () { setMode("title"); }, 500);
    }
    step();
  }

  function startGame() {
    audioCtx();
    resetRun();
    setMode("game");
  }
  function goFull() {
    var el = document.getElementById("wrap");
    if (!document.fullscreenElement) el.requestFullscreen && el.requestFullscreen();
    else document.exitFullscreen && document.exitFullscreen();
  }

  window.addEventListener("keydown", function (e) {
    keys[e.code] = true;
    if (e.code === "Tab") { e.preventDefault(); showMap = !showMap; }
    if (e.code === "Escape") {
      if (mode === "game") { document.exitPointerLock && document.exitPointerLock(); setMode("pause"); }
      else if (mode === "pause") setMode("game");
    }
    if (e.code === "KeyM") showMap = !showMap;
    if (e.code === "Space") e.preventDefault();
  });
  window.addEventListener("keyup", function (e) { keys[e.code] = false; });

  canvas.addEventListener("click", function () {
    if (mode !== "game") return;
    if (!isTouch && canvas.requestPointerLock) canvas.requestPointerLock();
    fireHeld = true;
    shoot();
    setTimeout(function () { fireHeld = false; }, 80);
  });
  document.addEventListener("mousemove", function (e) {
    if (mode !== "game") return;
    if (document.pointerLockElement === canvas) dir += e.movementX * 0.0025;
  });
  document.addEventListener("mousedown", function (e) {
    if (mode === "game" && e.button === 0) fireHeld = true;
  });
  document.addEventListener("mouseup", function () { fireHeld = false; });

  var joyId = null, lookId = null, joy0 = { x: 0, y: 0 };
  function stickPos(x, y) {
    var base = document.getElementById("stick").getBoundingClientRect();
    var cx = base.left + base.width / 2, cy = base.top + base.height / 2;
    var dx = x - cx, dy = y - cy;
    var m = Math.hypot(dx, dy), max = 40;
    if (m > max) { dx = dx / m * max; dy = dy / m * max; m = max; }
    document.getElementById("knob").style.left = 55 + dx + "px";
    document.getElementById("knob").style.top = 55 + dy + "px";
    mvx = dx / max;
    mvy = -dy / max;
  }
  touchUI.addEventListener("touchstart", function (e) {
    for (var i = 0; i < e.changedTouches.length; i++) {
      var t = e.changedTouches[i];
      var r = document.getElementById("stick").getBoundingClientRect();
      if (t.clientX < r.right + 20 && t.clientY > r.top - 20) { joyId = t.identifier; stickPos(t.clientX, t.clientY); }
      else lookId = t.identifier;
    }
  }, { passive: true });
  window.addEventListener("touchmove", function (e) {
    var i, t, lt = null;
    for (i = 0; i < e.touches.length; i++) {
      t = e.touches[i];
      if (t.identifier === joyId) stickPos(t.clientX, t.clientY);
      if (t.identifier === lookId) lt = t;
    }
    if (lt) {
      if (touchLookLast !== null) dir += (lt.clientX - touchLookLast) * 0.006;
      touchLookLast = lt.clientX;
    }
  }, { passive: true });
  window.addEventListener("touchend", function (e) {
    for (var i = 0; i < e.changedTouches.length; i++) {
      var id = e.changedTouches[i].identifier;
      if (id === joyId) {
        joyId = null; mvx = 0; mvy = 0;
        document.getElementById("knob").style.left = "55px";
        document.getElementById("knob").style.top = "55px";
      }
      if (id === lookId) { lookId = null; touchLookLast = null; }
    }
  });
  document.getElementById("btn-fire").addEventListener("touchstart", function (e) { e.preventDefault(); fireHeld = true; shoot(); }, { passive: false });
  document.getElementById("btn-fire").addEventListener("touchend", function () { fireHeld = false; });
  document.getElementById("btn-use").addEventListener("touchstart", function (e) { e.preventDefault(); tryUse(); }, { passive: false });
  document.getElementById("btn-map").addEventListener("click", function () { showMap = !showMap; });

  var last = performance.now();
  function loop(t) {
    var dt = Math.min(0.05, (t - last) / 1000);
    last = t;
    if (mode === "game") update(dt);
    if (mode === "game" || mode === "pause") render();
    requestAnimationFrame(loop);
  }
  setMode("boot");
  requestAnimationFrame(loop);
})();
</script>
</body>
