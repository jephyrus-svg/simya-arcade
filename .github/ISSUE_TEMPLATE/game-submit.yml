name: 게임 제출
description: 심야오락실에 HTML 게임을 올립니다. 관리자가 승인하면 홈피에 게시됩니다.
title: "[게임] "
labels: ["game-submit"]
body:
  - type: markdown
    attributes:
      value: |
        가능하면 [홈피 제출 페이지](https://jephyrus-svg.github.io/simya-arcade/submit.html)를 사용해 주세요.
        이 이슈로 직접 올릴 때는 아래에 JSON을 채우고, **zip 또는 index.html을 첨부**하세요.
  - type: textarea
    id: payload
    attributes:
      label: 제출 JSON
      description: 아래 형식을 유지하세요. id는 영문 소문자/숫자/하이픈만.
      value: |
        <!-- simya-arcade-submission -->
        ```json
        {
          "id": "my-game",
          "title": "게임 제목",
          "genre": "액션",
          "players": "1인",
          "controls": "방향키 · 스페이스",
          "blurb": "한 줄 소개",
          "entry": "index.html",
          "author": ""
        }
        ```
        <!-- /simya-arcade-submission -->
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        ## 파일 첨부
        이 이슈 본문 아래 댓글/첨부 영역에 `simya-my-game.zip` 또는 `index.html` 과 커버 이미지를 드래그하세요.
        관리자가 `approved` 라벨을 달면 홈피에 바로 올라갑니다.
